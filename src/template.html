<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SF Field Hotspot</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e0e0e0; }

  header { padding: 20px 32px; border-bottom: 1px solid #2a2a3a; display: flex; align-items: center; gap: 24px; }
  header h1 { font-size: 18px; font-weight: 600; color: #fff; }
  header p { font-size: 13px; color: #888; }

  .filters { padding: 12px 32px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid #1a1a2a; }
  .filters + .filters { border-bottom: 1px solid #2a2a3a; background: #0d0d14; }
  .filter-label { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 0.06em; margin-right: 2px; }
  .filter-btn { padding: 5px 13px; border-radius: 20px; border: 1px solid #333; background: #1a1a2e; color: #aaa; cursor: pointer; font-size: 12px; transition: all 0.15s; }
  .filter-btn:hover { border-color: #5566cc; color: #fff; }
  .filter-btn.active { background: #2a2a4e; border-color: #5566cc; color: #fff; }
  .filter-btn.critical { border-color: #ff4400; color: #ff6633; }
  .filter-btn.critical.active { background: #2a1000; }
  .filter-btn.high { border-color: #cc5500; color: #ff9944; }
  .filter-btn.high.active { background: #1e0e00; }
  .filter-sep { width: 1px; height: 20px; background: #2a2a3a; margin: 0 2px; }
  .filter-input { padding: 5px 12px; border-radius: 20px; border: 1px solid #333; background: #1a1a2e; color: #e0e0e0; font-size: 12px; outline: none; width: 160px; }
  .filter-input:focus { border-color: #5566cc; }
  .filter-input::placeholder { color: #555; }
  .filter-select { padding: 5px 12px; border-radius: 20px; border: 1px solid #333; background: #1a1a2e; color: #aaa; font-size: 12px; outline: none; cursor: pointer; }
  .filter-select:focus { border-color: #5566cc; }
  .filter-select option { background: #1a1a2e; }

  .main { display: flex; height: calc(100vh - 145px); }
  #chart { flex: 1; overflow: hidden; }

  .sidebar { width: 340px; border-left: 1px solid #2a2a3a; overflow-y: auto; padding: 20px; display: none; }
  .sidebar.visible { display: block; }
  .sidebar h2 { font-size: 15px; font-weight: 600; margin-bottom: 4px; word-break: break-word; }
  .sidebar .object-label { font-size: 12px; color: #888; margin-bottom: 16px; }
  .sidebar .close { float: right; cursor: pointer; color: #666; font-size: 18px; line-height: 1; }
  .sidebar .close:hover { color: #fff; }

  .flow-section h3 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #888; margin-bottom: 8px; margin-top: 16px; }
  .flow-entry { display: flex; align-items: flex-start; gap: 6px; margin: 3px 0; }
  .flow-name { font-size: 11px; color: #ccc; line-height: 1.6; word-break: break-word; flex: 1; }
  .el-badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 600; white-space: nowrap; flex-shrink: 0; margin-top: 2px; }
  .el-badge.start     { background: #1a3a1a; color: #66cc66; border: 1px solid #2a6a2a; }
  .el-badge.decision  { background: #2a2a1a; color: #cccc44; border: 1px solid #6a6a2a; }
  .el-badge.recordUpdate { background: #3a1a1a; color: #f57a7a; border: 1px solid #8c2a2a; }
  .el-badge.assignment   { background: #1a2a3a; color: #7ab8f5; border: 1px solid #2a5a8c; }
  .el-badge.screen       { background: #1a1a3a; color: #aa88ff; border: 1px solid #443388; }

  .risk-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; margin-left: 8px; vertical-align: middle; }
  .risk-badge.critical { background: #ff4400; color: #fff; }
  .risk-badge.high     { background: #cc5500; color: #fff; }
  .risk-badge.medium   { background: #776600; color: #ffdd44; }
  .risk-badge.write    { background: #3a1a1a; color: #f57a7a; }
  .risk-badge.read     { background: #1a3a5c; color: #7ab8f5; }

  .legend { padding: 10px 32px; display: flex; gap: 20px; align-items: center; font-size: 11px; color: #666; border-top: 1px solid #2a2a3a; flex-wrap: wrap; }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 4px; }

  circle { cursor: pointer; }
  circle:hover { opacity: 0.8; }
  .bubble-label { pointer-events: none; text-anchor: middle; dominant-baseline: middle; }
</style>
</head>
<body>

<header>
  <div>
    <h1>SF Field Hotspot</h1>
    <p id="subtitle">Loading...</p>
  </div>
</header>

<div class="filters" id="risk-filters">
  <span class="filter-label">Risk</span>
  <button class="filter-btn active" data-risk="all">All</button>
  <button class="filter-btn critical" data-risk="critical">Critical — recordUpdate + start</button>
  <button class="filter-btn high" data-risk="high">High — assignment + start</button>
  <button class="filter-btn" data-risk="medium">Medium — write + decision</button>
  <button class="filter-btn" data-risk="write">Write only</button>
  <button class="filter-btn" data-risk="read">Read only</button>
  <div class="filter-sep"></div>
  <select class="filter-select" id="object-filter"><option value="">All objects</option></select>
  <input class="filter-input" id="field-search" type="text" placeholder="Search field…">
  <!-- TODO: flow filter — show only fields touched by a selected flow -->
</div>

<div class="filters">
  <span class="filter-label">Element</span>
  <button class="filter-btn active" data-element="all">All</button>
  <button class="filter-btn" data-element="start">start</button>
  <button class="filter-btn" data-element="decision">decision</button>
  <button class="filter-btn" data-element="recordUpdate">recordUpdate</button>
  <button class="filter-btn" data-element="assignment">assignment</button>
  <button class="filter-btn" data-element="screen">screen flow</button>
</div>

<div class="main">
  <div id="chart"></div>
  <div class="sidebar" id="sidebar">
    <span class="close" id="close-sidebar">×</span>
    <h2 id="sidebar-field"></h2>
    <div class="object-label" id="sidebar-object"></div>
    <div id="sidebar-content"></div>
  </div>
</div>

<div class="legend">
  <span><span class="legend-dot" style="background:#ff4400"></span>Critical: recordUpdate writes field, another flow conditions on it at start</span>
  <span><span class="legend-dot" style="background:#cc5500"></span>High: assignment writes field, another flow conditions on it at start</span>
  <span><span class="legend-dot" style="background:#ccaa00"></span>Medium: written field appears in decision nodes</span>
  <span><span class="legend-dot" style="background:#cc4444"></span>Write only</span>
  <span><span class="legend-dot" style="background:#3366aa"></span>Read only</span>
  <span style="margin-left:4px">Bubble size = total flow references</span>
</div>

<script>
const DATA = __DATA__;

const colours = {
    critical: '#dd3300',
    high:     '#bb5500',
    medium:   '#886600',
    write:    '#884444',
    read:     '#335588',
};

let activeRisk = 'all';
let activeElement = 'all';
let activeObject = '';
let fieldSearch = '';

function filtered() {
    return DATA.filter(d => {
        if (activeRisk !== 'all' && d.risk !== activeRisk) return false;
        if (activeObject && d.object !== activeObject) return false;
        if (fieldSearch && !d.field.toLowerCase().includes(fieldSearch.toLowerCase())) return false;
        if (activeElement !== 'all') {
            const inReaders = d.readers.some(r => r.element === activeElement);
            const inWriters = d.writers.some(w => w.element === activeElement);
            if (!inReaders && !inWriters) return false;
        }
        return true;
    });
}

const container = document.getElementById('chart');

function render() {
    container.innerHTML = '';
    const data = filtered();
    if (!data.length) {
        container.innerHTML = '<p style="padding:40px;color:#555">No fields match this filter.</p>';
        return;
    }

    const W = container.clientWidth, H = container.clientHeight;
    const svg = d3.select(container).append('svg').attr('width', W).attr('height', H);

    const maxSize = d3.max(data, d => d.size) || 1;
    const r = d3.scaleSqrt().domain([1, maxSize]).range([18, Math.min(W, H) / 8]);
    const nodes = data.map(d => ({ ...d, r: r(d.size) }));

    const sim = d3.forceSimulation(nodes)
        .force('charge', d3.forceManyBody().strength(5))
        .force('center', d3.forceCenter(W / 2, H / 2))
        .force('collision', d3.forceCollide(d => d.r + 3))
        .stop();

    for (let i = 0; i < 300; i++) sim.tick();

    const g = svg.selectAll('g').data(nodes).join('g')
        .attr('transform', d => `translate(${Math.max(d.r, Math.min(W - d.r, d.x))},${Math.max(d.r, Math.min(H - d.r, d.y))})`)
        .on('click', (_, d) => showSidebar(d));

    g.append('circle')
        .attr('r', d => d.r)
        .attr('fill', d => colours[d.risk])
        .attr('fill-opacity', 0.8)
        .attr('stroke', d => colours[d.risk])
        .attr('stroke-width', 1.5);

    g.append('text')
        .attr('class', 'bubble-label')
        .attr('font-size', d => Math.max(9, Math.min(12, d.r / 3)))
        .attr('fill', '#fff')
        .text(d => d.r > 22 ? d.field : '');
}

function elBadge(element) {
    return `<span class="el-badge ${element}">${element}</span>`;
}

function showSidebar(d) {
    document.getElementById('sidebar-field').innerHTML =
        d.field + `<span class="risk-badge ${d.risk}">${d.risk}</span>`;
    document.getElementById('sidebar-object').textContent = d.object;

    let html = '';
    if (d.writers.length) {
        html += `<div class="flow-section"><h3>Written by (${d.writers.length})</h3>`;
        for (const w of d.writers) {
            html += `<div class="flow-entry">${elBadge(w.element)}<span class="flow-name">${w.flow}</span></div>`;
        }
        html += '</div>';
    }
    if (d.readers.length) {
        html += `<div class="flow-section"><h3>Conditions on (${d.readers.length})</h3>`;
        for (const r of d.readers) {
            html += `<div class="flow-entry">${elBadge(r.element)}<span class="flow-name">${r.flow}</span></div>`;
        }
        html += '</div>';
    }
    document.getElementById('sidebar-content').innerHTML = html;
    document.getElementById('sidebar').classList.add('visible');
}

document.getElementById('close-sidebar').addEventListener('click', () => {
    document.getElementById('sidebar').classList.remove('visible');
});

document.querySelectorAll('[data-risk]').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('[data-risk]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeRisk = btn.dataset.risk;
        render();
    });
});

document.querySelectorAll('[data-element]').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('[data-element]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeElement = btn.dataset.element;
        render();
    });
});

const objects = [...new Set(DATA.map(d => d.object))].sort();
const objectSelect = document.getElementById('object-filter');
objects.forEach(obj => {
    const opt = document.createElement('option');
    opt.value = obj; opt.textContent = obj;
    objectSelect.appendChild(opt);
});
objectSelect.addEventListener('change', () => { activeObject = objectSelect.value; render(); });
document.getElementById('field-search').addEventListener('input', e => { fieldSearch = e.target.value; render(); });

document.getElementById('subtitle').textContent =
    `${DATA.length} fields · ${objects.length} objects · ` +
    `${DATA.filter(d => d.risk === 'critical').length} critical · ` +
    `${DATA.filter(d => d.risk === 'high').length} high`;

window.addEventListener('resize', render);
render();
</script>
</body>
</html>
